<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Справочник форм автомобилей</title>
<style>
/* ===== Сброс и переменные ===== */
* { box-sizing: border-box; }
:root {
  --bg: #f5f7fb; --card: #fff; --ink: #1b2130; --muted: #667085;
  --line: #e5e9f0; --accent: #2f5bea; --accent-soft: #e8eeff;
  --danger: #d92d20; --danger-soft: #fdecea;
  --ok: #12b76a; --radius: 14px;
  --shadow: 0 6px 24px rgba(20,30,60,.06);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
body {
  margin: 0; font-family: var(--font); background: var(--bg); color: var(--ink);
  line-height: 1.6; -webkit-font-smoothing: antialiased;
  min-height: 100vh; display: flex; flex-direction: column;
}
#app { flex: 1; padding-top: 28px; padding-bottom: 48px; }
.container { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 20px; }
h1 { font-size: 28px; margin: 0 0 8px; line-height: 1.25; }
h2 { font-size: 21px; margin: 24px 0 12px; }
h3 { margin: 8px 0 6px; font-size: 18px; }

/* ===== Шапка и подвал ===== */
.site-header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255,255,255,.92); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.header-inner { display: flex; align-items: center; justify-content: space-between; height: 62px; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; color: var(--ink); text-decoration: none; }
.site-header nav { display: flex; gap: 6px; }
.site-header nav a { padding: 8px 14px; border-radius: 10px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 14.5px; transition: .15s; }
.site-header nav a:hover,
.site-header nav a.active { color: var(--accent); background: var(--accent-soft); }
.site-footer { border-top: 1px solid var(--line); background: #fff; padding: 18px 0; color: var(--muted); font-size: 14px; text-align: center; }
.site-footer p { margin: 0; }

/* ===== Кнопки и теги ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 16px; border-radius: 10px; font-size: 14.5px; font-weight: 600;
  text-decoration: none; cursor: pointer; border: 1px solid var(--line);
  background: #fff; color: var(--ink); transition: .15s; font-family: inherit;
}
.btn:hover { border-color: #cfd6e4; background: #fafbff; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: #2448c8; }
.btn.danger { color: var(--danger); border-color: #f3c3be; }
.btn.danger:hover { background: var(--danger-soft); }
.btn.sm { padding: 6px 11px; font-size: 13px; border-radius: 8px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.tag {
  display: inline-block; font-size: 12px; font-weight: 700;
  padding: 3px 9px; border-radius: 7px;
  background: var(--accent-soft); color: var(--accent);
  text-transform: uppercase; letter-spacing: .3px;
}

/* ===== Каталог ===== */
.page-head { margin-bottom: 18px; }
.page-head p { margin: 0; color: var(--muted); }
.toolbar { display: flex; gap: 12px; margin-bottom: 22px; }
.toolbar input, .toolbar select, .field input, .field select, .field textarea {
  font: inherit; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink);
}
.toolbar input { flex: 1; min-width: 0; }
.toolbar select { min-width: 200px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
.card {
  display: flex; flex-direction: column; background: var(--card);
  border-radius: var(--radius); overflow: hidden;
  border: 1px solid var(--line); box-shadow: var(--shadow);
  text-decoration: none; color: inherit; transition: .2s;
}
.card:hover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(20,30,60,.1); }
.card-img { aspect-ratio: 16/10; background: #eef1f8; overflow: hidden; }
.card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; flex: 1; }
.card-body p { margin: 0 0 12px; color: var(--muted); font-size: 14.5px; }
.card-foot { margin-top: auto; display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.card-foot .more { color: var(--accent); font-weight: 700; }
.empty { text-align: center; padding: 60px 20px; color: var(--muted); background: #fff; border: 1px dashed var(--line); border-radius: var(--radius); }
.empty h2 { margin-top: 0; color: var(--ink); }

/* Пагинация */
.pagination { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 28px; flex-wrap: wrap; }
.pg { min-width: 38px; height: 38px; border: 1px solid var(--line); background: #fff; border-radius: 9px; font: inherit; font-weight: 600; cursor: pointer; color: var(--ink); }
.pg:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.pg.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.pg:disabled { opacity: .4; cursor: not-allowed; }
.pg-dots { color: var(--muted); padding: 0 4px; }

/* ===== Страница просмотра ===== */
.back-link { display: inline-block; margin-bottom: 16px; color: var(--accent); text-decoration: none; font-weight: 600; }
.form-view-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 30px; align-items: start; }
.gallery .main-img { width: 100%; aspect-ratio: 16/10; object-fit: cover; border-radius: var(--radius); border: 1px solid var(--line); background: #eef1f8; display: block; }
.thumbs { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.thumb { width: 84px; padding: 0; border: 2px solid transparent; border-radius: 10px; overflow: hidden; cursor: pointer; background: none; }
.thumb img { width: 100%; aspect-ratio: 16/10; object-fit: cover; display: block; }
.thumb.active { border-color: var(--accent); }
.form-info .lead { font-size: 18px; color: var(--muted); margin: 6px 0 14px; }
.form-stats { display: flex; gap: 18px; color: var(--muted); font-size: 14px; margin-bottom: 16px; flex-wrap: wrap; }
.desc { white-space: pre-line; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; }

/* ===== Авторизация ===== */
.auth-wrap { display: flex; justify-content: center; padding-top: 30px; }
.auth-card { width: 100%; max-width: 400px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px; }
.auth-card h2 { margin-top: 0; }
.hint { color: var(--muted); font-size: 14px; }
.err { color: var(--danger); font-weight: 600; min-height: 1.4em; margin: 12px 0 0; }

/* ===== Админка ===== */
.admin-layout { display: grid; grid-template-columns: 220px 1fr; gap: 28px; align-items: start; }
.admin-nav { position: sticky; top: 86px; display: flex; flex-direction: column; gap: 4px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; }
.admin-nav a { padding: 10px 14px; border-radius: 10px; text-decoration: none; color: var(--muted); font-weight: 600; white-space: nowrap; }
.admin-nav a:hover, .admin-nav a.active { background: var(--accent-soft); color: var(--accent); }
.admin-nav a.logout { color: var(--danger); }
.admin-content { min-width: 0; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin: 16px 0 8px; }
.stat-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); }
.stat-card .k { color: var(--muted); font-size: 14px; }
.stat-card .v { font-size: 32px; font-weight: 800; color: var(--accent); }
.row-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.row-head h1 { margin: 0; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.table-wrap { overflow-x: auto; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); font-size: 14.5px; vertical-align: middle; }
th { background: #fafbff; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .3px; }
tr:last-child td { border-bottom: 0; }
td .btn { margin-right: 4px; }
td img.thumb-sm { width: 60px; border-radius: 6px; display: block; }

/* ===== Формы ===== */
.form-grid { display: grid; gap: 18px; max-width: 720px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.form-grid .field { margin-bottom: 0; }
.field label { font-weight: 600; font-size: 14px; }
.field textarea { resize: vertical; min-height: 80px; }
.form-actions { display: flex; gap: 10px; }
.previews { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
.img-prev { position: relative; width: 120px; }
.img-prev img { width: 100%; aspect-ratio: 16/10; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); display: block; }
.img-prev .x { position: absolute; top: -8px; right: -8px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: var(--danger); color: #fff; font-size: 16px; line-height: 1; cursor: pointer; }
.cat-add { display: flex; gap: 10px; margin-bottom: 18px; }
.cat-add input { flex: 1; min-width: 0; font: inherit; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; }

/* ===== Тосты ===== */
.toast { position: fixed; right: 20px; bottom: 20px; z-index: 999; background: #1b2130; color: #fff; padding: 12px 18px; border-radius: 10px; font-weight: 600; opacity: 0; transform: translateY(12px); transition: .3s; max-width: calc(100vw - 40px); }
.toast.show { opacity: 1; transform: none; }
.toast.success { background: var(--ok); }
.toast.error { background: var(--danger); }

/* ===== Адаптив ===== */
@media (max-width: 900px) {
  .form-view-grid, .admin-layout { grid-template-columns: 1fr; }
  .admin-nav { position: static; flex-direction: row; overflow-x: auto; }
}
@media (max-width: 560px) {
  .toolbar { flex-direction: column; }
  .toolbar input, .toolbar select { width: 100%; }
  h1 { font-size: 23px; }
  .header-inner { height: 56px; }
  .site-header nav a { padding: 6px 10px; }
  .logo { font-size: 16px; }
}

/* ===== Печать ===== */
@media print { .site-header, .site-footer, .toast { display: none; } body { background: #fff; } }
</style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="#/" class="logo">🚗 <span>Формы авто</span></a>
      <nav>
        <a href="#/" id="nav-home">Каталог</a>
        <a href="#/admin" id="nav-admin">Админ-панель</a>
      </nav>
    </div>
  </header>
  <main id="app" class="container">
    <div class="empty"><h2>Загрузка…</h2></div>
  </main>
  <footer class="site-footer">
    <div class="container">
      <p>Учебный проект · HTML / CSS / JS · localStorage</p>
    </div>
  </footer>

<script>
/* ============ Шаг 4. Константы и утилиты ============ */
const K = {
  forms: 'cf_forms',
  cats: 'cf_categories',
  nextId: 'cf_nextId',
  admin: 'cf_admin',
  initialized: 'cf_initialized'
};
const ADMIN_DEFAULT = { login: 'admin', password: 'admin123' };
const PER_PAGE = 6;
const app = document.getElementById('app');

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

function now() {
  return new Date().toLocaleDateString('ru-RU');
}

function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 300);
  }, 2600);
}

/* Заглушка-картинка: SVG в data-URL */
function ph(text, color) {
  color = color || '#2f5bea';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500">
    <rect width="800" height="500" fill="${color}"/>
    <text x="400" y="260" fill="#fff" font-family="Arial" font-size="52"
          font-weight="bold" text-anchor="middle">${esc(text)}</text>
  </svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* SHA-256 через Web Crypto, с запасным вариантом */
async function hashPassword(pwd) {
  try {
    if (window.crypto && crypto.subtle && crypto.subtle.digest) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pwd));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) {}
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < pwd.length; i++) {
    const ch = pwd.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 'fb' + (h2 >>> 0).toString(16) + (h1 >>> 0).toString(16);
}

function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(r.error);
    r.readAsDataURL(file);
  });
}
function validateImage(file) {
  const ok = ['image/jpeg', 'image/png', 'image/webp'];
  if (!ok.includes(file.type)) return 'Недопустимый формат.';
  if (file.size > 500 * 1024) return 'Файл больше 500 КБ.';
  return null;
}

/* ============ Шаг 5. Хранение данных ============ */
function getForms() {
  try { return JSON.parse(localStorage.getItem(K.forms) || '[]'); }
  catch (e) { return []; }
}
function setForms(arr) {
  try { localStorage.setItem(K.forms, JSON.stringify(arr)); }
  catch (e) {
    toast('Превышен лимит хранилища. Удалите часть изображений.', 'error');
    throw e;
  }
}
function getCats() {
  try { return JSON.parse(localStorage.getItem(K.cats) || '[]'); }
  catch (e) { return []; }
}
function setCats(arr) {
  try { localStorage.setItem(K.cats, JSON.stringify(arr)); }
  catch (e) { toast('Ошибка сохранения', 'error'); }
}
function nextId() {
  const n = +(localStorage.getItem(K.nextId) || '1');
  localStorage.setItem(K.nextId, n + 1);
  return n;
}
function isAuthed() { return sessionStorage.getItem(K.admin) === '1'; }
function requireAuth() {
  if (!isAuthed()) { location.hash = '#/admin/login'; return false; }
  return true;
}

/* ============ Шаг 6. Инициализация и демо-данные ============ */
const SEED = [
  { title: 'Седан', category: 'Легковые', short: 'Классический кузов с отдельным багажником',
    desc: 'Седан — трёхобъёмный кузов: моторный отсек, салон и отдельный багажник.\nОбычно имеет четыре двери и жёсткую перегородку между салоном и багажником.\nПримеры: Toyota Camry, Hyundai Sonata, Skoda Octavia.', color: '#2f5bea' },
  { title: 'Хэтчбек', category: 'Легковые', short: 'Компактный кузов с задней дверью-«пятой дверью»',
    desc: 'Хэтчбек — двухобъёмный кузов, багажник объединён с салоном и открывается вместе с задним стеклом.\nУдобен в городе и при перевозке небольших грузов.\nПримеры: Volkswagen Golf, Kia Rio X, Ford Focus.', color: '#12b76a' },
  { title: 'Универсал', category: 'Легковые', short: 'Вытянутая крыша и большой багажный отсек',
    desc: 'Универсал — двухобъёмный кузов с удлинённой крышей и вместительным багажником.\nСиденья складываются, образуя длинный грузовой отсек.\nПримеры: Skoda Octavia Combi, Volvo V90, Lada Vesta SW.', color: '#f79009' },
  { title: 'Купе', category: 'Легковые', short: 'Спортивный двухдверный кузов со скошенной крышей',
    desc: 'Купе — кузов с двумя дверями и, как правило, наклонной линией крыши.\nУступает седану по удобству задних мест, но выигрывает в динамике и стиле.\nПримеры: BMW 4 Series, Audi TT, Ford Mustang.', color: '#7a5af8' },
  { title: 'Внедорожник (SUV)', category: 'Внедорожники', short: 'Высокий клиренс, полный привод, большой салон',
    desc: 'SUV — кузов с повышенным клиренсом и, как правило, полным приводом.\nПодходит для плохих дорог и поездок всей семьёй.\nПримеры: Toyota Land Cruiser, Nissan X-Trail, Lada Niva Travel.', color: '#d92d20' },
  { title: 'Пикап', category: 'Грузовые', short: 'Кабина и открытая грузовая платформа',
    desc: 'Пикап — кузов с закрытой кабиной и открытым грузовым кузовом сзади.\nСочетает возможности легкового и грузового авто.\nПримеры: Toyota Hilux, Ford F-150, Mitsubishi L200.', color: '#475467' }
];

async function init() {
  if (!localStorage.getItem(K.initialized)) {
    setCats(['Легковые', 'Внедорожники', 'Грузовые']);
    const forms = SEED.map((s, i) => ({
      id: i + 1,
      title: s.title,
      category: s.category,
      short_description: s.short,
      description: s.desc,
      main_image: ph(s.title, s.color),
      images: [ph(s.title + ' — вид 1', s.color), ph(s.title + ' — вид 2', s.color)],
      views: Math.floor(Math.random() * 40) + 3,
      created_at: now(),
      updated_at: now()
    }));
    setForms(forms);
    localStorage.setItem(K.nextId, forms.length + 1);
    const adminHash = await hashPassword(ADMIN_DEFAULT.password);
    localStorage.setItem(K.admin, JSON.stringify({ login: ADMIN_DEFAULT.login, hash: adminHash }));
    localStorage.setItem(K.initialized, '1');
  }
  route();
}

/* ============ Шаг 7. Роутер ============ */
function route() {
  const hash = location.hash.slice(1) || '/';
  const parts = hash.split('/').filter(Boolean);

  document.querySelectorAll('.site-header nav a').forEach(a => a.classList.remove('active'));
  if (parts[0] === 'admin') document.getElementById('nav-admin').classList.add('active');
  else document.getElementById('nav-home').classList.add('active');
  window.scrollTo(0, 0);

  if (parts[0] === 'form' && parts[1]) { renderForm(+parts[1]); return; }

  if (parts[0] === 'admin') {
    if (parts[1] === 'login') { renderAdminLogin(); return; }
    if (parts[1] === 'logout') {
      sessionStorage.removeItem(K.admin);
      toast('Вы вышли', 'success');
      location.hash = '#/'; return;
    }
    if (!requireAuth()) return;
    if (parts[1] === 'forms') { renderAdminForms(); return; }
    if (parts[1] === 'categories') { renderAdminCategories(); return; }
    if (parts[1] === 'form' && parts[2] === 'add') { renderAdminForm(null); return; }
    if (parts[1] === 'form' && parts[2] === 'edit') { renderAdminForm(+parts[3]); return; }
    renderAdminDashboard(); return;
  }
  renderHome();
}
window.addEventListener('hashchange', route);
document.addEventListener('DOMContentLoaded', init);

/* ============ Шаг 8. Каталог ============ */
let state = { q: '', cat: '', page: 1 };

function renderHome() {
  state = { q: '', cat: '', page: 1 };
  app.innerHTML = `
    <div class="page-head">
      <h1>Справочник форм автомобилей</h1>
      <p>Типы кузова: описание, характеристики, фотографии</p>
    </div>
    <div class="toolbar">
      <input type="search" id="q" placeholder="🔍 Поиск по названию…">
      <select id="catSel"></select>
    </div>
    <div id="results"></div>
  `;
  document.getElementById('catSel').innerHTML =
    `<option value="">Все категории</option>` +
    getCats().map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');

  document.getElementById('q').addEventListener('input', e => {
    state.q = e.target.value; state.page = 1; renderHomeList();
  });
  document.getElementById('catSel').addEventListener('change', e => {
    state.cat = e.target.value; state.page = 1; renderHomeList();
  });
  document.getElementById('results').addEventListener('click', e => {
    const btn = e.target.closest('[data-page]');
    if (!btn || btn.disabled) return;
    state.page = +btn.dataset.page;
    renderHomeList();
    document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
  });
  renderHomeList();
}

function renderHomeList() {
  const q = state.q.trim().toLowerCase();
  const cat = state.cat;

  const filtered = getForms().filter(f => {
    const matchQ = !q || (f.title || '').toLowerCase().includes(q);
    const matchC = !cat || f.category === cat;
    return matchQ && matchC;
  }).sort((a, b) => b.id - a.id);

  const totalPages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));
  if (state.page > totalPages) state.page = totalPages;
  const start = (state.page - 1) * PER_PAGE;
  const pageItems = filtered.slice(start, start + PER_PAGE);

  const results = document.getElementById('results');
  if (!pageItems.length) {
    results.innerHTML = `<div class="empty">
      <h2>Ничего не найдено</h2>
      <p>Попробуйте изменить запрос или категорию.</p>
    </div>`;
    return;
  }
  let html = '<div class="grid">';
  for (const f of pageItems) {
    html += `
      <a class="card" href="#/form/${f.id}">
        <div class="card-img"><img src="${esc(f.main_image || ph('Нет фото'))}" alt="${esc(f.title)}"></div>
        <div class="card-body">
          <span class="tag">${esc(f.category)}</span>
          <h3>${esc(f.title)}</h3>
          <p>${esc(f.short_description || '')}</p>
          <div class="card-foot">
            <span>👁 ${f.views || 0} просмотров</span>
            <span class="more">Подробнее →</span>
          </div>
        </div>
      </a>`;
  }
  html += '</div>' + paginationHtml(totalPages, state.page);
  results.innerHTML = html;
}

function paginationHtml(total, current) {
  if (total <= 1) return '';
  let html = '<div class="pagination">';
  html += `<button class="pg" data-page="${current - 1}" ${current === 1 ? 'disabled' : ''}>←</button>`;
  let last = 0;
  for (let i = 1; i <= total; i++) {
    if (i === 1 || i === total || Math.abs(i - current) <= 2) {
      if (i - last > 1) html += '<span class="pg-dots">…</span>';
      html += `<button class="pg ${i === current ? 'active' : ''}" data-page="${i}">${i}</button>`;
      last = i;
    }
  }
  html += `<button class="pg" data-page="${current + 1}" ${current === total ? 'disabled' : ''}>→</button>`;
  return html + '</div>';
}

/* ============ Шаг 9. Страница просмотра ============ */
function renderForm(id) {
  const forms = getForms();
  const idx = forms.findIndex(f => f.id === id);
  if (idx === -1) {
    app.innerHTML = `<div class="empty">
      <h2>Запись не найдена</h2>
      <p style="margin-top:12px"><a href="#/" class="btn">← Вернуться в каталог</a></p>
    </div>`;
    return;
  }
  forms[idx].views = (forms[idx].views || 0) + 1;
  setForms(forms);
  const f = forms[idx];
  const images = [f.main_image, ...(f.images || [])].filter(Boolean);
  const mainSrc = images[0] || ph('Нет фото');

  app.innerHTML = `
    <a href="#/" class="back-link">← Назад к каталогу</a>
    <div class="form-view-grid">
      <div class="gallery">
        <img id="mainImg" class="main-img" src="${esc(mainSrc)}" alt="${esc(f.title)}">
        <div class="thumbs">
          ${images.map((src, i) => `
            <button class="thumb ${i === 0 ? 'active' : ''}" data-src="${esc(src)}">
              <img src="${esc(src)}" alt="">
            </button>`).join('')}
        </div>
      </div>
      <div class="form-info">
        <span class="tag">${esc(f.category)}</span>
        <h1>${esc(f.title)}</h1>
        <p class="lead">${esc(f.short_description || '')}</p>
        <div class="form-stats">
          <span>👁 ${f.views} просмотров</span>
          <span>📅 ${esc(f.created_at)}</span>
        </div>
        <div class="desc">${esc(f.description || '')}</div>
      </div>
    </div>`;

  const thumbs = document.querySelectorAll('.thumb');
  thumbs.forEach(t => {
    t.addEventListener('click', () => {
      document.getElementById('mainImg').src = t.dataset.src;
      thumbs.forEach(x => x.classList.remove('active'));
      t.classList.add('active');
    });
  });
}

/* ============ Шаг 10. Авторизация ============ */
function renderAdminLogin() {
  app.innerHTML = `
    <div class="auth-wrap">
      <form class="auth-card" id="loginForm">
        <h2>Вход в админ-панель</h2>
        <p class="hint">По умолчанию: <b>admin</b> / <b>admin123</b></p>
        <div class="field">
          <label>Логин</label>
          <input name="login" required autofocus>
        </div>
        <div class="field">
          <label>Пароль</label>
          <input name="password" type="password" required>
        </div>
        <button class="btn primary" type="submit">Войти</button>
        <p class="err" id="err"></p>
      </form>
    </div>`;

  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const login = (fd.get('login') || '').toString().trim();
    const password = (fd.get('password') || '').toString();
    const err = document.getElementById('err');
    err.textContent = '';
    const admin = JSON.parse(localStorage.getItem(K.admin) || 'null');
    if (!admin) { err.textContent = 'Администратор не настроен.'; return; }
    const hash = await hashPassword(password);
    if (login === admin.login && hash === admin.hash) {
      sessionStorage.setItem(K.admin, '1');
      toast('Добро пожаловать!', 'success');
      location.hash = '#/admin';
    } else {
      err.textContent = 'Неверный логин или пароль';
    }
  });
}

/* ============ Шаг 11. Дашборд ============ */
function adminShell(content, active) {
  const items = [
    ['#/admin', 'Дашборд', 'dash'],
    ['#/admin/forms', 'Записи', 'forms'],
    ['#/admin/categories', 'Категории', 'cats']
  ];
  return `
    <div class="admin-layout">
      <aside class="admin-nav">
        ${items.map(([href, label, key]) =>
          `<a href="${href}" class="${active === key ? 'active' : ''}">${label}</a>`).join('')}
        <a href="#/admin/logout" class="logout">Выйти</a>
      </aside>
      <div class="admin-content">${content}</div>
    </div>`;
}

  const forms = getForms();
  const cats = getCats();
  const totalViews = forms.reduce((s, f) => s + (f.views || 0), 0);
  const last = [...forms].sort((a, b) => b.id - a.id).slice(0, 5);

  const content = `
    <h1>Дашборд</h1>
    <div class="stats-grid">
      <div class="stat-card"><div class="k">Всего форм</div><div class="v">${forms.length}</div></div>
      <div class="stat-card"><div class="k">Всего просмотров</div><div class="v">${totalViews}</div></div>
      <div class="stat-card"><div class="k">Категорий</div><div class="v">${cats.length}</div></div>
    </div>
    <h2>Последние добавленные</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Фото</th><th>Название</th><th>Категория</th><th>Просмотры</th><th>Дата</th></tr></thead>
        <tbody>
          ${last.length ? last.map(f => `
            <tr>
              <td><img class="thumb-sm" src="${esc(f.main_image || ph('—'))}" alt=""></td>
              <td><b>${esc(f.title)}</b></td>
              <td>${esc(f.category)}</td>
              <td>${f.views || 0}</td>
              <td>${esc(f.created_at)}</td>
            </tr>`).join('') : '<tr><td colspan="5">Записей пока нет</td></tr>'}
        </tbody>
      </table>
    </div>
    <div class="actions">
      <a href="#/admin/form/add" class="btn primary">+ Добавить запись</a>
      <button class="btn danger" id="resetBtn">Сбросить демо-данные</button>
    </div>
  `;
  app.innerHTML = adminShell(content, 'dash');

  document.getElementById('resetBtn').addEventListener('click', async () => {
    if (!confirm('Сбросить все данные?')) return;
    [K.forms, K.cats, K.nextId, K.admin, K.initialized].forEach(key => localStorage.removeItem(key));
    sessionStorage.removeItem(K.admin);
    await init();
    toast('Демо-данные восстановлены', 'success');
  });
}

/* ============ Шаг 12. Список записей ============ */
function renderAdminForms() {
  const forms = [...getForms()].sort((a, b) => b.id - a.id);
  const content = `
    <div class="row-head">
      <h1>Записи (${forms.length})</h1>
      <a href="#/admin/form/add" class="btn primary">+ Добавить</a>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Фото</th><th>Название</th><th>Категория</th>
          <th>Просмотры</th><th>Дата</th><th>Действия</th>
        </tr></thead>
        <tbody>
          ${forms.length ? forms.map(f => `
            <tr>
              <td><img class="thumb-sm" src="${esc(f.main_image || ph('—'))}" alt=""></td>
              <td><b>${esc(f.title)}</b></td>
              <td>${esc(f.category)}</td>
              <td>${f.views || 0}</td>
              <td>${esc(f.created_at)}</td>
              <td>
                <a href="#/form/${f.id}" class="btn sm">👁</a>
                <a href="#/admin/form/edit/${f.id}" class="btn sm">✎</a>
                <button class="btn sm danger" data-del="${f.id}">🗑</button>
              </td>
            </tr>`).join('') : '<tr><td colspan="6">Записей пока нет</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
  app.innerHTML = adminShell(content, 'forms');

  app.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = +btn.dataset.del;
      const f = getForms().find(x => x.id === id);

      if (!confirm(`Удалить запись «${f.title}»?`)) return;
      setForms(getForms().filter(x => x.id !== id));
      toast('Запись удалена', 'success');
      renderAdminForms();
    });

}

/* ============ Шаг 13. Добавление / редактирование ============ */
function renderAdminForm(id) {
  const isEdit = id != null;
  const existing = isEdit ? getForms().find(f => f.id === id) : null;
  if (isEdit && !existing) {
    app.innerHTML = adminShell('<div class="empty"><h2>Запись не найдена</h2></div>', 'forms');
    return;
  }
  const cats = getCats();
  if (!cats.length) {
    app.innerHTML = adminShell(`<div class="empty">
      <h2>Сначала создайте категорию</h2>
      <p style="margin-top:12px"><a href="#/admin/categories" class="btn primary">Перейти к категориям</a></p>
    </div>`, 'forms');
    return;
  }

  let mainImage = existing ? existing.main_image : null;
  let gallery = existing ? [...(existing.images || [])] : [];

  const content = `
    <h1>${isEdit ? 'Редактирование' : 'Новая запись'}</h1>
    <form class="form-grid" id="form">
      <div class="field">
        <label>Название *</label>
        <input name="title" required value="${existing ? esc(existing.title) : ''}">
      </div>
      <div class="field">
        <label>Категория *</label>
        <select name="category" required>
          ${cats.map(c => `<option value="${esc(c)}"
            ${existing && existing.category === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Краткое описание</label>
        <textarea name="short_description">${existing ? esc(existing.short_description || '') : ''}</textarea>
      </div>
      <div class="field">
        <label>Полное описание</label>
        <textarea name="description" rows="7">${existing ? esc(existing.description || '') : ''}</textarea>
      </div>
      <div class="field">
        <label>Главное изображение (JPG, PNG, WebP, до 500 КБ)</label>
        <input type="file" name="mainFile" accept="image/jpeg,image/png,image/webp">
        <div id="mainPreview"></div>
      </div>
      <div class="field">
        <label>Галерея</label>
        <input type="file" name="galleryFiles" accept="image/jpeg,image/png,image/webp" multiple>
        <div class="previews" id="galleryPreview"></div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn primary">${isEdit ? 'Сохранить' : 'Добавить'}</button>
        <a href="#/admin/forms" class="btn">Отмена</a>
      </div>
    </form>`;
  app.innerHTML = adminShell(content, 'forms');

  const mainPreview = document.getElementById('mainPreview');
  const galleryPreview = document.getElementById('galleryPreview');

  function renderMainPreview() {
    mainPreview.innerHTML = mainImage
      ? `<div class="img-prev">
          <img src="${esc(mainImage)}">
          <button type="button" class="x" data-rm-main>×</button>
        </div>`
      : '<p class="hint">Не выбрано</p>';
    const rm = mainPreview.querySelector('[data-rm-main]');
    if (rm) rm.onclick = () => { mainImage = null; renderMainPreview(); };
  }
  function renderGalleryPreview() {
    galleryPreview.innerHTML = gallery.map((src, i) =>
      `<div class="img-prev">
        <img src="${esc(src)}">
        <button type="button" class="x" data-rm-g="${i}">×</button>
      </div>`
    ).join('');
    galleryPreview.querySelectorAll('[data-rm-g]').forEach(btn => {
      btn.onclick = () => { gallery.splice(+btn.dataset.rmG, 1); renderGalleryPreview(); };
    });
  }
  renderMainPreview();
  renderGalleryPreview();

  document.querySelector('[name="mainFile"]').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    const err = validateImage(file);
    if (err) { toast(err, 'error'); e.target.value = ''; return; }
    mainImage = await readFileAsDataURL(file);
    renderMainPreview();
  });
  document.querySelector('[name="galleryFiles"]').addEventListener('change', async e => {
    for (const file of [...e.target.files]) {
      const err = validateImage(file);
      if (err) { toast(`${file.name}: ${err}`, 'error'); continue; }
      gallery.push(await readFileAsDataURL(file));
    }
    e.target.value = '';
    renderGalleryPreview();
  });

  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = {
      title: fd.get('title').toString().trim(),
      category: fd.get('category').toString(),
      short_description: fd.get('short_description').toString().trim(),
      description: fd.get('description').toString().trim()
    };
    if (!data.title) { toast('Введите название', 'error'); return; }
    const forms = getForms();
    if (isEdit) {
      const i = forms.findIndex(f => f.id === id);
      forms[i] = { ...forms[i], ...data, main_image: mainImage, images: gallery, updated_at: now() };
    } else {
      forms.push({
        id: nextId(),
        ...data,
        main_image: mainImage,
        images: gallery,
        views: 0,
        created_at: now(),
        updated_at: now()
      });
    }
    try { setForms(forms); } catch (err) { return; }
    toast(isEdit ? 'Сохранено' : 'Добавлено', 'success');
    location.hash = '#/admin/forms';
  });
}

/* ============ Шаг 14. Категории ============ */
function renderAdminCategories() {
  const cats = getCats();
  const forms = getForms();
  const content = `
    <h1>Категории (${cats.length})</h1>
    <form class="cat-add" id="addCat">
      <input name="name" placeholder="Название новой категории" required>
      <button class="btn primary" type="submit">+ Добавить</button>
    </form>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Название</th><th>Записей</th><th>Действия</th></tr></thead>
        <tbody>
          ${cats.length ? cats.map(c => `
            <tr>
              <td><b>${esc(c)}</b></td>
              <td>${forms.filter(f => f.category === c).length}</td>
              <td>
                <button class="btn sm" data-rename="${esc(c)}">✎ Переименовать</button>
                <button class="btn sm danger" data-rmcat="${esc(c)}">🗑</button>
              </td>
            </tr>`).join('') : '<tr><td colspan="3">Категорий пока нет</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
  app.innerHTML = adminShell(content, 'cats');

  document.getElementById('addCat').addEventListener('submit', e => {
    e.preventDefault();
    const name = e.target.querySelector('[name="name"]').value.trim();
    if (!name) return;
    const cats = getCats();
    if (cats.includes(name)) { toast('Такая категория уже есть', 'error'); return; }
    cats.push(name);
    setCats(cats);
    renderAdminCategories();
  });

  app.querySelectorAll('[data-rename]').forEach(btn => {
    btn.addEventListener('click', () => {
      const oldName = btn.dataset.rename;
      const newName = prompt('Новое название:', oldName);
      if (!newName || newName.trim() === oldName) return;
      const trimmed = newName.trim();
      if (!trimmed) return;
      if (getCats().includes(trimmed)) { toast('Такая категория уже есть', 'error'); return; }
      setCats(getCats().map(c => c === oldName ? trimmed : c));
      setForms(getForms().map(f => f.category === oldName ? { ...f, category: trimmed } : f));
      renderAdminCategories();
    });
  });

  app.querySelectorAll('[data-rmcat]').forEach(btn => {
    btn.addEventListener('click', () => {
      const name = btn.dataset.rmcat;
      const count = getForms().filter(f => f.category === name).length;
      if (count > 0) {
        toast(`Нельзя удалить: в категории ${count} записей`, 'error');
        return;
      }
      if (!confirm(`Удалить «${name}»?`)) return;
      setCats(getCats().filter(c => c !== name));
      renderAdminCategories();
    });
  });
}
</script>
